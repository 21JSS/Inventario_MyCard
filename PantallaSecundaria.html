<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Pcs y Perifericos</title>
    <link rel="stylesheet" href="Estilos2.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1> Inventario de Pcs Y Perifericos</h1>
            <p style="color: #666; font-size: 1.1em;">Sistema de gestión de equipos MyCard </p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total de Equipos</div>
                <div class="stat-value" id="totalEquipos">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Disponibles</div>
                <div class="stat-value" id="totalDisponibles">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">En Uso</div>
                <div class="stat-value" id="totalEnUso">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ocupadas</div>
                <div class="stat-value" id="totalOcupadas">0</div>
            </div>
        </div>

        <div class="table container"></div>
        <table id="inventarioTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre></th>
                    <th>Tipo>></th>
                </tr>
            </thead>
        </table>

    </div>


</body>

</html>
