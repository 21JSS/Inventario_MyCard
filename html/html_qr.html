<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escanear QR - MyCard</title>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Kanit&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style_qr.css">
</head>
<body>
    <div class="titulo">
        <h1>Escanea el codigo QR</h1>
    </div>

    <div class="parrafo">
        <p></p>
    </div>
    <div id="scanner-wrapper">
        <div id="my-qr-reader"></div>

        
        <div id="scan-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../services/scanner_qr.js"></script>
</body>
</html>
