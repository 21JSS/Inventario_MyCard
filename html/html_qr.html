<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace(`https://${location.hostname}${location.pathname}${location.search}`);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz de Escaneo QR - MyCard</title>
    <link rel="stylesheet" href="../css/style_qr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Kanit&family=Lilita+One&display=swap"
        rel="stylesheet">
    <style>
        .btn-volver {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a8dda;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Bricolage Grotesque';
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 141, 218, 0.4);
            background: #157acb;
        }

        #my-qr-reader {
            border: 2px solid #1a8dda !important;
            border-radius: 12px;
            overflow: hidden;
            background: white !important;
        }

        #fallback-camera {
            display: block !important;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            border: 1px border var(--shadow-buttons);
        }

        .fallback-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-scanner-action {
            position: static !important;
            margin: 0 !important;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Bricolage Grotesque';
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-camera {
            background: #059669;
        }

        .btn-camera:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        .btn-upload {
            background: #6366f1;
        }

        .btn-upload:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn-volver">
        <i class="fa-solid fa-arrow-left"></i> Volver
    </a>

    <div class="container">
        <div class="contenedor-titulo">
            <div class="titulo">
                <h1>Escanea el código QR</h1>
            </div>
        </div>

        <div class="qr">
            <div id="my-qr-reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>

            <!-- Botones de respaldo para cuando la cámara en vivo es bloqueada -->
            <div id="fallback-camera">
                <p style="font-size: 0.95em; color: #f87171; margin-bottom: 5px; font-weight: 600;">¿La cámara no abre?
                </p>
                <p style="font-size: 0.85em; color: #a1a1aa; margin-bottom: 20px;">Usa las opciones de abajo:</p>

                <div class="fallback-buttons">
                    <input type="file" id="qr-input-file" accept="image/*" capture="camera" style="display: none;">
                    <button onclick="document.getElementById('qr-input-file').click()"
                        class="btn-scanner-action btn-camera">
                        <i class="fa-solid fa-camera"></i> Tomar Foto
                    </button>

                    <input type="file" id="qr-input-file-gallery" accept="image/*" style="display: none;">
                    <button onclick="document.getElementById('qr-input-file-gallery').click()"
                        class="btn-scanner-action btn-upload">
                        <i class="fa-solid fa-image"></i> Subir de Galería
                    </button>
                </div>
            </div>
        </div>

        <div class="contenedor-parrafo">
            <div class="parrafo">
                <p>Al escanear te saldrán los detalles del equipo automáticamente</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../services/scanner_qr.js"></script>
</body>

</html>
