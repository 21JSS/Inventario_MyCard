<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escanear QR - MyCard</title>
    <link rel="stylesheet" href="../css/style_qr.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
</head>

<body>


    <div id="scanner-wrapper">


        <div id="my-qr-reader"></div>


        <canvas id="qr-overlay"></canvas>


        <div id="scan-overlay">


            <div id="scan-header">
                <h1>MyCard</h1>
                <p>Escanea el código QR del equipo</p>
            </div>


            <div id="scan-frame">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div id="scan-line"></div>
            </div>


            <p id="scan-hint">Apunta la cámara al código QR</p>

        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../services/scanner_qr.js"></script>
</body>

</html>
